<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubra seu Signo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 380px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffd700, #ff9f43);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #bbb;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #ddd;
        }

        input[type="date"] {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            margin-bottom: 25px;
            outline: none;
            transition: 0.3s;
        }

        input[type="date"]:focus {
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 2px #ffd700;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #ff9f43, #ff6b6b);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }

        /* Tela de carregamento */
        .loading {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 10;
        }

        .loading.mostrar {
            opacity: 1;
            visibility: visible;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 215, 0, 0.2);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            font-size: 1.1rem;
            color: #ffd700;
            font-weight: 500;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Resultado */
        .resultado {
            margin-top: 10px;
            padding: 25px 15px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.07);
            display: none;
            animation: fadeIn 0.6s ease;
        }

        .resultado.mostrar {
            display: block;
        }

        .emoji {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        .signo-nome {
            font-size: 2.1rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffd700;
        }

        .signo-periodo {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 16px;
        }

        .signo-descricao {
            font-size: 0.95rem;
            line-height: 1.55;
            color: #ddd;
            margin-bottom: 25px;
        }

        .btn-atualizar {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            margin-top: 5px;
        }

        .btn-atualizar:hover {
            box-shadow: 0 8px 20px rgba(79, 172, 254, 0.4);
        }

        /* Esconde o formulário quando mostra resultado */
        .formulario.esconder {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tela de carregamento -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Atualizando seu signo...</div>
        </div>

        <!-- Formulário -->
        <div class="formulario" id="formulario">
            <h1>✨ Descubra seu Signo</h1>
            <p class="subtitle">Informe sua data de nascimento</p>

            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento">

            <button onclick="descobrirSigno()">Descobrir Signo</button>
        </div>

        <!-- Resultado -->
        <div class="resultado" id="resultado">
            <div class="emoji" id="emoji"></div>
            <div class="signo-nome" id="nomeSigno"></div>
            <div class="signo-periodo" id="periodo"></div>
            <div class="signo-descricao" id="descricao"></div>
            <button class="btn-atualizar" onclick="voltarFormulario()">Atualizar data</button>
        </div>
    </div>

    <script>
        const signos = [
            {
                nome: "Capricórnio",
                emoji: "♑",
                inicio: [12, 22],
                fim: [1, 19],
                descricao: "Prático, disciplinado e ambicioso. Valoriza o trabalho duro e a responsabilidade."
            },
            {
                nome: "Aquário",
                emoji: "♒",
                inicio: [1, 20],
                fim: [2, 18],
                descricao: "Inovador, independente e humanitário. Ama a liberdade e as ideias originais."
            },
            {
                nome: "Peixes",
                emoji: "♓",
                inicio: [2, 19],
                fim: [3, 20],
                descricao: "Sensível, intuitivo e sonhador. Tem grande empatia e imaginação."
            },
            {
                nome: "Áries",
                emoji: "♈",
                inicio: [3, 21],
                fim: [4, 19],
                descricao: "Corajoso, energético e pioneiro. Gosta de desafios e de liderar."
            },
            {
                nome: "Touro",
                emoji: "♉",
                inicio: [4, 20],
                fim: [5, 20],
                descricao: "Estável, leal e sensível aos prazeres. Valoriza segurança e conforto."
            },
            {
                nome: "Gêmeos",
                emoji: "♊",
                inicio: [5, 21],
                fim: [6, 20],
                descricao: "Comunicativo, curioso e versátil. Adora aprender e conversar."
            },
            {
                nome: "Câncer",
                emoji: "♋",
                inicio: [6, 21],
                fim: [7, 22],
                descricao: "Emotivo, protetor e intuitivo. Muito ligado à família e ao lar."
            },
            {
                nome: "Leão",
                emoji: "♌",
                inicio: [7, 23],
                fim: [8, 22],
                descricao: "Carismático, generoso e confiante. Ama brilhar e ser admirado."
            },
            {
                nome: "Virgem",
                emoji: "♍",
                inicio: [8, 23],
                fim: [9, 22],
                descricao: "Analítico, perfeccionista e prestativo. Preza pela ordem e eficiência."
            },
            {
                nome: "Libra",
                emoji: "♎",
                inicio: [9, 23],
                fim: [10, 22],
                descricao: "Diplomático, justo e sociável. Busca harmonia e equilíbrio."
            },
            {
                nome: "Escorpião",
                emoji: "♏",
                inicio: [10, 23],
                fim: [11, 21],
                descricao: "Intenso, determinado e misterioso. Tem grande poder de transformação."
            },
            {
                nome: "Sagitário",
                emoji: "♐",
                inicio: [11, 22],
                fim: [12, 21],
                descricao: "Aventureiro, otimista e filosófico. Ama liberdade e novas experiências."
            }
        ];

        function descobrirSigno() {
            const dataInput = document.getElementById("dataNascimento").value;

            if (!dataInput) {
                alert("Por favor, selecione uma data de nascimento!");
                return;
            }

            // Mostra a tela de carregamento
            document.getElementById("loading").classList.add("mostrar");

            // Simula um pequeno atraso para a animação ficar bonita
            setTimeout(() => {
                const data = new Date(dataInput + "T00:00:00");
                const dia = data.getDate();
                const mes = data.getMonth() + 1;

                let signoEncontrado = null;

                for (let s of signos) {
                    const [mesInicio, diaInicio] = s.inicio;
                    const [mesFim, diaFim] = s.fim;

                    if (s.nome === "Capricórnio") {
                        if ((mes === 12 && dia >= 22) || (mes === 1 && dia <= 19)) {
                            signoEncontrado = s;
                            break;
                        }
                    } else {
                        if (
                            (mes === mesInicio && dia >= diaInicio) ||
                            (mes === mesFim && dia <= diaFim) ||
                            (mesInicio < mesFim && mes > mesInicio && mes < mesFim)
                        ) {
                            signoEncontrado = s;
                            break;
                        }
                    }
                }

                if (signoEncontrado) {
                    document.getElementById("emoji").textContent = signoEncontrado.emoji;
                    document.getElementById("nomeSigno").textContent = signoEncontrado.nome;

                    const meses = ["", "Jan", "Fev", "Mar", "Abr", "Mai", "Jun",
                                   "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
                    const periodo = `${signoEncontrado.inicio[1]} ${meses[signoEncontrado.inicio[0]]} – ${signoEncontrado.fim[1]} ${meses[signoEncontrado.fim[0]]}`;
                    document.getElementById("periodo").textContent = periodo;
                    document.getElementById("descricao").textContent = signoEncontrado.descricao;

                    // Esconde formulário e mostra resultado
                    document.getElementById("formulario").classList.add("esconder");
                    document.getElementById("resultado").classList.add("mostrar");
                }

                // Esconde a tela de carregamento
                document.getElementById("loading").classList.remove("mostrar");
            }, 1200); // 1.2 segundos de "carregamento"
        }

        function voltarFormulario() {
            document.getElementById("resultado").classList.remove("mostrar");
            document.getElementById("formulario").classList.remove("esconder");
            document.getElementById("dataNascimento").value = "";
        }
    </script>
</body>
</html>
