<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubra seu Signo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
            transition: background 0.8s ease;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 430px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffd700, #ff9f43);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #bbb;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 10px;
            font-size: 1rem;
            color: #ffd700;
            font-weight: 600;
        }

        input[type="date"] {
            width: 100%;
            padding: 18px 16px;
            border: 2px solid #ffd700;
            border-radius: 14px;
            background: rgba(255, 215, 0, 0.08);
            color: #fff;
            font-size: 1.15rem;
            outline: none;
            transition: all 0.35s ease;
            text-align: center;
            letter-spacing: 1px;
            animation: brilho 2.2s infinite ease-in-out;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.35);
            margin-bottom: 12px;
        }

        @keyframes brilho {
            0%, 100% { box-shadow: 0 0 12px rgba(255, 215, 0, 0.3); }
            50% { box-shadow: 0 0 28px rgba(255, 215, 0, 0.65); }
        }

        input[type="date"]:focus {
            background: rgba(255, 215, 0, 0.18);
            box-shadow: 0 0 0 5px rgba(255, 215, 0, 0.3), 0 0 30px rgba(255, 215, 0, 0.5);
            transform: scale(1.04);
            animation: none;
        }

        input[type="date"].preenchido {
            background: rgba(255, 215, 0, 0.22);
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.35), 0 0 35px rgba(255, 215, 0, 0.6);
            transform: scale(1.05);
            animation: none;
        }

        .feedback-data {
            font-size: 0.95rem;
            color: #ffd700;
            margin-bottom: 22px;
            height: 22px;
            opacity: 0;
            transition: 0.35s;
            font-weight: 600;
        }

        .feedback-data.mostrar {
            opacity: 1;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #ff9f43, #ff6b6b);
            color: white;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0.65;
        }

        button.ativo {
            opacity: 1;
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        button:hover.ativo {
            transform: scale(1.05) translateY(-2px);
        }

        .loading {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.97);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 10;
        }

        .loading.mostrar {
            opacity: 1;
            visibility: visible;
        }

        .spinner {
            width: 55px;
            height: 55px;
            border: 5px solid rgba(255, 215, 0, 0.2);
            border-top: 5px solid #ffd700;
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
            margin-bottom: 22px;
        }

        .loading-text {
            font-size: 1.15rem;
            color: #ffd700;
            font-weight: 600;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .resultado {
            display: none;
            opacity: 0;
            transform: scale(0.7);
            transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .resultado.mostrar {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .emoji {
            font-size: 4.8rem;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.6));
            animation: emojiEntrada 0.7s ease;
        }

        @keyframes emojiEntrada {
            0% { transform: scale(0) rotate(-30deg); opacity: 0; }
            60% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        .signo-nome {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            animation: nomeEntrada 0.6s ease 0.15s both;
        }

        @keyframes nomeEntrada {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .idade {
            font-size: 1.25rem;
            color: #4facfe;
            font-weight: 600;
            margin-bottom: 10px;
            animation: nomeEntrada 0.6s ease 0.2s both;
        }

        .signo-periodo {
            font-size: 1.05rem;
            color: #ccc;
            margin-bottom: 20px;
            animation: nomeEntrada 0.6s ease 0.25s both;
        }

        .signo-descricao {
            font-size: 1.02rem;
            line-height: 1.65;
            color: #e8e8e8;
            margin-bottom: 28px;
            background: rgba(255, 255, 255, 0.08);
            padding: 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            animation: nomeEntrada 0.6s ease 0.35s both;
        }

        .btn-atualizar {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            opacity: 1 !important;
            animation: nomeEntrada 0.6s ease 0.45s both;
        }

        .btn-atualizar:hover {
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.5);
            transform: scale(1.04) translateY(-2px);
        }

        .formulario.esconder {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Atualizando seu signo...</div>
        </div>

        <div class="formulario" id="formulario">
            <h1>✨ Descubra seu Signo</h1>
            <p class="subtitle">Selecione sua data de nascimento</p>

            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento">
            
            <div class="feedback-data" id="feedback">Data selecionada!</div>

            <button id="btnDescobrir" onclick="descobrirSigno()">Descobrir Signo</button>
        </div>

        <div class="resultado" id="resultado">
            <div class="emoji" id="emoji"></div>
            <div class="signo-nome" id="nomeSigno"></div>
            <div class="idade" id="idade"></div>
            <div class="signo-periodo" id="periodo"></div>
            <div class="signo-descricao" id="descricao"></div>
            <button class="btn-atualizar" onclick="voltarFormulario()">Atualizar data</button>
        </div>
    </div>

    <script>
        const inputData = document.getElementById("dataNascimento");
        const btn = document.getElementById("btnDescobrir");
        const feedback = document.getElementById("feedback");

        // ========== SONS ==========
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function tocarSomSelecao() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        function tocarSomRevelacao() {
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.type = "sine";
            osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            gain1.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc1.start();
            osc1.stop(audioCtx.currentTime + 0.4);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.type = "sine";
            osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15);
            gain2.gain.setValueAtTime(0.12, audioCtx.currentTime + 0.15);
            gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.55);
            osc2.start(audioCtx.currentTime + 0.15);
            osc2.stop(audioCtx.currentTime + 0.55);

            const osc3 = audioCtx.createOscillator();
            const gain3 = audioCtx.createGain();
            osc3.connect(gain3);
            gain3.connect(audioCtx.destination);
            osc3.type = "sine";
            osc3.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.3);
            gain3.gain.setValueAtTime(0.15, audioCtx.currentTime + 0.3);
            gain3.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            osc3.start(audioCtx.currentTime + 0.3);
            osc3.stop(audioCtx.currentTime + 0.8);
        }

        // Cores de fundo para cada signo
        const fundosPorSigno = {
            "Áries": "linear-gradient(135deg, #3a0a0a, #8b0000, #ff4500)",
            "Touro": "linear-gradient(135deg, #0d2818, #1a4d2e, #2e8b57)",
            "Gêmeos": "linear-gradient(135deg, #2c2a1a, #5c4e1a, #f0c929)",
            "Câncer": "linear-gradient(135deg, #0a1a2e, #1a3a5c, #87ceeb)",
            "Leão": "linear-gradient(135deg, #3a2a0a, #8b5a00, #ffd700)",
            "Virgem": "linear-gradient(135deg, #1a1a12, #3d3d2a, #a8a77a)",
            "Libra": "linear-gradient(135deg, #2a1a2e, #5c3a6e, #ee82ee)",
            "Escorpião": "linear-gradient(135deg, #1a0a0a, #4a0000, #8b0000)",
            "Sagitário": "linear-gradient(135deg, #1a0a2e, #3a1a6e, #9b59b6)",
            "Capricórnio": "linear-gradient(135deg, #0a1a12, #1a3a2a, #2e8b57)",
            "Aquário": "linear-gradient(135deg, #0a1a2e, #1a3a5c, #00ced1)",
            "Peixes": "linear-gradient(135deg, #0a1a2e, #1a2a4a, #6495ed)"
        };

        // ========== SALVAR E CARREGAR ÚLTIMA DATA ==========
        function salvarUltimaData(data) {
            localStorage.setItem("ultimaDataNascimento", data);
        }

        function carregarUltimaData() {
            const dataSalva = localStorage.getItem("ultimaDataNascimento");
            if (dataSalva) {
                inputData.value = dataSalva;
                inputData.classList.add("preenchido");
                feedback.classList.add("mostrar");
                btn.classList.add("ativo");
            }
        }

        // Impede data futura no próprio campo
        function definirMaxData() {
            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, "0");
            const dia = String(hoje.getDate()).padStart(2, "0");
            inputData.max = `${ano}-${mes}-${dia}`;
        }

        inputData.addEventListener("change", function() {
            if (this.value) {
                // Verifica se a data é futura
                const hoje = new Date();
                hoje.setHours(0, 0, 0, 0);
                const dataEscolhida = new Date(this.value + "T00:00:00");

                if (dataEscolhida > hoje) {
                    alert("A data de nascimento não pode ser no futuro!");
                    this.value = "";
                    this.classList.remove("preenchido");
                    feedback.classList.remove("mostrar");
                    btn.classList.remove("ativo");
                    return;
                }

                this.classList.add("preenchido");
                feedback.classList.add("mostrar");
                btn.classList.add("ativo");
                tocarSomSelecao();
                salvarUltimaData(this.value); // Salva a data
            } else {
                this.classList.remove("preenchido");
                feedback.classList.remove("mostrar");
                btn.classList.remove("ativo");
            }
        });

        inputData.addEventListener("input", function() {
            if (this.value) {
                this.classList.add("preenchido");
                feedback.classList.add("mostrar");
                btn.classList.add("ativo");
            }
        });

        window.onload = function() {
            definirMaxData();      // Bloqueia datas futuras no calendário
            carregarUltimaData();  // Carrega a última data salva
            inputData.focus();
        };

        const signos = [
            { nome: "Capricórnio", emoji: "♑", inicio: [12, 22], fim: [1, 19], descricao: "Prático, disciplinado e ambicioso. Valoriza o trabalho duro e a responsabilidade." },
            { nome: "Aquário", emoji: "♒", inicio: [1, 20], fim: [2, 18], descricao: "Inovador, independente e humanitário. Ama a liberdade e as ideias originais." },
            { nome: "Peixes", emoji: "♓", inicio: [2, 19], fim: [3, 20], descricao: "Sensível, intuitivo e sonhador. Tem grande empatia e imaginação." },
            { nome: "Áries", emoji: "♈", inicio: [3, 21], fim: [4, 19], descricao: "Corajoso, energético e pioneiro. Gosta de desafios e de liderar." },
            { nome: "Touro", emoji: "♉", inicio: [4, 20], fim: [5, 20], descricao: "Estável, leal e sensível aos prazeres. Valoriza segurança e conforto." },
            { nome: "Gêmeos", emoji: "♊", inicio: [5, 21], fim: [6, 20], descricao: "Comunicativo, curioso e versátil. Adora aprender e conversar." },
            { nome: "Câncer", emoji: "♋", inicio: [6, 21], fim: [7, 22], descricao: "Emotivo, protetor e intuitivo. Muito ligado à família e ao lar." },
            { nome: "Leão", emoji: "♌", inicio: [7, 23], fim: [8, 22], descricao: "Carismático, generoso e confiante. Ama brilhar e ser admirado." },
            { nome: "Virgem", emoji: "♍", inicio: [8, 23], fim: [9, 22], descricao: "Analítico, perfeccionista e prestativo. Preza pela ordem e eficiência." },
            { nome: "Libra", emoji: "♎", inicio: [9, 23], fim: [10, 22], descricao: "Diplomático, justo e sociável. Busca harmonia e equilíbrio." },
            { nome: "Escorpião", emoji: "♏", inicio: [10, 23], fim: [11, 21], descricao: "Intenso, determinado e misterioso. Tem grande poder de transformação." },
            { nome: "Sagitário", emoji: "♐", inicio: [11, 22], fim: [12, 21], descricao: "Aventureiro, otimista e filosófico. Ama liberdade e novas experiências." }
        ];

        function calcularIdade(dataNascimento) {
            const hoje = new Date();
            const nascimento = new Date(dataNascimento + "T00:00:00");
            
            let idade = hoje.getFullYear() - nascimento.getFullYear();
            const mes = hoje.getMonth() - nascimento.getMonth();
            
            if (mes < 0 || (mes === 0 && hoje.getDate() < nascimento.getDate())) {
                idade--;
            }
            
            return idade;
        }

        function descobrirSigno() {
            const dataInput = inputData.value;

            if (!dataInput) {
                alert("Por favor, selecione uma data de nascimento!");
                return;
            }

            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);
            const dataEscolhida = new Date(dataInput + "T00:00:00");

            if (dataEscolhida > hoje) {
                alert("A data de nascimento não pode ser no futuro!");
                return;
            }

            // Salva a data novamente (por garantia)
            salvarUltimaData(dataInput);

            document.getElementById("loading").classList.add("mostrar");

            setTimeout(() => {
                const data = new Date(dataInput + "T00:00:00");
                const dia = data.getDate();
                const mes = data.getMonth() + 1;

                let signoEncontrado = null;

                for (let s of signos) {
                    const [mesInicio, diaInicio] = s.inicio;
                    const [mesFim, diaFim] = s.fim;

                    if (s.nome === "Capricórnio") {
                        if ((mes === 12 && dia >= 22) || (mes === 1 && dia <= 19)) {
                            signoEncontrado = s;
                            break;
                        }
                    } else {
                        if (
                            (mes === mesInicio && dia >= diaInicio) ||
                            (mes === mesFim && dia <= diaFim) ||
                            (mesInicio < mesFim && mes > mesInicio && mes < mesFim)
                        ) {
                            signoEncontrado = s;
                            break;
                        }
                    }
                }

                if (signoEncontrado) {
                    const idade = calcularIdade(dataInput);

                    document.getElementById("emoji").textContent = signoEncontrado.emoji;
                    document.getElementById("nomeSigno").textContent = signoEncontrado.nome;
                    document.getElementById("idade").textContent = `Você tem ${idade} anos`;

                    const meses = ["", "Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
                    const periodo = `${signoEncontrado.inicio[1]} ${meses[signoEncontrado.inicio[0]]} – ${signoEncontrado.fim[1]} ${meses[signoEncontrado.fim[0]]}`;
                    document.getElementById("periodo").textContent = periodo;
                    document.getElementById("descricao").textContent = signoEncontrado.descricao;

                    document.body.style.background = fundosPorSigno[signoEncontrado.nome];

                    document.getElementById("formulario").classList.add("esconder");
                    
                    setTimeout(() => {
                        document.getElementById("resultado").classList.add("mostrar");
                        tocarSomRevelacao();
                    }, 50);
                }

                document.getElementById("loading").classList.remove("mostrar");
            }, 1400);
        }

        function voltarFormulario() {
            document.getElementById("resultado").classList.remove("mostrar");
            
            document.body.style.background = "linear-gradient(135deg, #1a1a2e, #16213e, #0f3460)";
            
            setTimeout(() => {
                document.getElementById("formulario").classList.remove("esconder");
                
                // Mantém a última data salva (não limpa)
                const dataSalva = localStorage.getItem("ultimaDataNascimento");
                if (dataSalva) {
                    inputData.value = dataSalva;
                    inputData.classList.add("preenchido");
                    feedback.classList.add("mostrar");
                    btn.classList.add("ativo");
                } else {
                    inputData.value = "";
                    inputData.classList.remove("preenchido");
                    feedback.classList.remove("mostrar");
                    btn.classList.remove("ativo");
                }
                
                inputData.focus();
            }, 300);
        }
    </script>
</body>
</html>
